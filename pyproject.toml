[project]
name = "veilleur"
version = "0.1.0"
description = "Daily tech-watch curator feeding a Zettelkasten"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "trafilatura>=1.12",
]

[project.scripts]
veilleur = "veilleur.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
