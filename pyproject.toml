[project]
name = "veilleur"
version = "0.1.0"
description = "Daily tech-watch curator that summarises feeds and links them into an Obsidian Zettelkasten"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Velia" }]
keywords = ["rss", "zettelkasten", "obsidian", "llm", "tech-watch", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Office/Business :: News/Diary",
    "Intended Audience :: Developers",
]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "trafilatura>=1.12",
]

[project.urls]
Repository = "https://github.com/Chikimuras/veilleur"
Issues = "https://github.com/Chikimuras/veilleur/issues"

[project.scripts]
veilleur = "veilleur.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
